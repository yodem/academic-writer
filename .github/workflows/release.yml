name: Version Bump & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level (overrides the commit-message inference)"
        required: false
        default: ""
        type: choice
        options: ["", "patch", "minor", "major"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Skip if this is a version-bump commit
        id: guard
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$COMMIT_MSG" | grep -q "^chore: bump version"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bump level, and every file the version lives in, are both decided by
      # scripts/version-sync.py against scripts/version-locations.json. The old
      # inline `${PARTS[2]} + 1` could only ever produce a patch, and wrote three
      # of the six locations — which is how features.json sat at 0.5.0 while
      # everything else said 0.6.3 for two releases.
      - name: Determine bump level
        if: steps.guard.outputs.skip == 'false'
        id: level
        env:
          # The whole push payload, not just head_commit: head_commit is the LAST
          # commit, so a merge commit would infer `patch` for a push that contains
          # feat: commits. version-sync takes the highest level across all of them.
          EVENT_JSON: ${{ toJSON(github.event) }}
          INPUT_LEVEL: ${{ inputs.level }}
        run: |
          if [[ -n "$INPUT_LEVEL" ]]; then
            LEVEL="$INPUT_LEVEL"
            echo "level from workflow_dispatch input: $LEVEL"
          else
            printf '%s' "$EVENT_JSON" > /tmp/push-event.json
            LEVEL=$(python3 scripts/version-sync.py --level-from-event /tmp/push-event.json)
            echo "level inferred from all commits in the push: $LEVEL"
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Bump version across every registered location
        if: steps.guard.outputs.skip == 'false'
        id: bump
        run: |
          NEW=$(python3 scripts/version-sync.py --bump "${{ steps.level.outputs.level }}" | tail -1)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "bumped to $NEW"

      # Re-run the build against the just-bumped source manifest so the
      # committed build output (plugins/academic-writer/.claude-plugin/plugin.json,
      # hooks dist, bundled MCP server) is regenerated at the new version
      # BEFORE anything is committed or pushed. Without this, the bump only
      # touches package.json/manifests/academic-writer.json/marketplace.json
      # and the built plugin.json silently drifts behind (see v0.6.1 incident).
      # Finding 10 of the 2026-09-01 audit: [Unreleased] had accumulated shipped
      # features because nothing ever renamed it. Renaming it in the same job that
      # writes the version is the only place it cannot be forgotten.
      - name: Roll CHANGELOG [Unreleased] into the released version
        if: steps.guard.outputs.skip == 'false'
        run: python3 scripts/version-sync.py --release-changelog "${{ steps.bump.outputs.new }}"

      - name: Rebuild plugin at bumped version
        if: steps.guard.outputs.skip == 'false'
        run: npm run build

      # These gates now run AFTER the bump + rebuild, against the exact
      # tree that is about to be committed and pushed — so a real desync
      # fails the job here and blocks the push, instead of only checking
      # the (already-consistent) pre-bump state.
      - name: Gate — version consistency (marketplace.json vs plugin.json)
        if: steps.guard.outputs.skip == 'false'
        run: bash scripts/check-version-consistency.sh

      - name: Gate — built manifest carries mcpServers (v0.3.0 regression guard)
        if: steps.guard.outputs.skip == 'false'
        run: bash scripts/check-built-manifest.sh

      - name: Gate — version agrees across ALL registered locations
        if: steps.guard.outputs.skip == 'false'
        run: python3 scripts/version-sync.py --check

      # Until 0.7.0 the whole deterministic suite gated nothing: release.yml
      # bumped, rebuilt, checked two manifests and published. A prior 804-line
      # suite had already rotted this way behind a bypassable local hook
      # (recorded in the plugin's CandleKeep audit). Tests that do not block a
      # release are decorative, so they now run here, against the bumped tree.
      - name: Gate — deterministic test suite
        if: steps.guard.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/ -q

      - name: Gate — strict TypeScript on hooks
        if: steps.guard.outputs.skip == 'false'
        run: npm run typecheck

      - name: Commit, tag, and push
        if: steps.guard.outputs.skip == 'false'
        run: |
          NEW="${{ steps.bump.outputs.new }}"

          # Every path version-sync.py can write, plus the rebuilt plugin tree.
          git add package.json manifests/academic-writer.json .claude-plugin/marketplace.json features.json CHANGELOG.md plugins/
          git commit -m "chore: bump version to v${NEW}"
          git tag "v${NEW}"
          git push origin main
          git push origin "v${NEW}"

      - name: Create GitHub Release
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.new }}"
          name: "v${{ steps.bump.outputs.new }}"
          generate_release_notes: true
