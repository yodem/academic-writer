name: Release

# Manual trigger ONLY, and it NO LONGER BUMPS THE VERSION.
#
# The version that ships is whatever is committed on main. Bumping is a
# maintainer action performed in the same change that edits the plugin —
# `python3 scripts/version-sync.py --bump patch|minor|major` writes all six
# registered locations, and the CHANGELOG section for that version is written by
# hand in the same commit. This workflow only verifies and publishes what is
# already there.
#
# Why the auto-bump is gone: the workflow used to derive a bump level from the
# commits since the last release tag and then write the new version itself. That
# made the tree's own version meaningless between releases — a maintainer who
# hand-bumped to prepare a release would get bumped a SECOND time by this job,
# publishing a tag that disagreed with the CHANGELOG section written for it.
# The version is now decided in exactly one place: the commit that makes the
# change. This job tags it.
#
# Consequences of the above, all deliberate:
#   - No `chore: bump version` commit, no push to main from CI. This job's only
#     writes are the tag and the GitHub Release, so it cannot race a maintainer's
#     push or leave main in a state nobody authored.
#   - No rebuild. The gates below check the tree AS COMMITTED — the exact bytes
#     that ship — rather than a tree this job just regenerated. The dist
#     freshness gate is what proves the committed build output still matches src/.
#   - Releasing the same version twice fails loudly on the tag guard rather than
#     silently moving a tag.
#
# Every gate below is textually identical to its counterpart in ci.yml, which runs
# them on every push to main and every PR. Keep them that way: identical `run:`
# lines are what stops the two files from drifting apart in what they check.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tags are fetched EXPLICITLY, not incidentally: actions/checkout's
          # fetch-tags default is false regardless of fetch-depth, and the
          # "tag already exists" guard below is worthless without them.
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ci.yml carries the same explicit install for the same reason: there is no
      # build step in this workflow, so src/hooks/node_modules is not created as a
      # side effect of one. The typecheck gate itself stays identical either way.
      - name: Install hooks dependencies (for the typecheck gate)
        run: cd src/hooks && npm ci

      # src/cli has its own node_modules, needed by the pytest gate (the end-to-end
      # tests bundle the `aw` tool from src/cli), `npm run test:cli` and
      # `npm run typecheck:cli`. ci.yml carries the identical step.
      - name: Install CLI dependencies (for the pytest, test:cli and typecheck:cli gates)
        run: cd src/cli && npm ci

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Read the version being released
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing v$VERSION (from package.json, not bumped by this job)"

      # Replaces the uniqueness the old bump step used to guarantee implicitly.
      # Without it, re-running this workflow without a hand-bump would try to
      # re-tag a released version.
      - name: Gate — v${{ steps.version.outputs.version }} is not already tagged
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::v${VERSION} is already tagged. Bump the version on main first:"
            echo "::error::  python3 scripts/version-sync.py --bump patch|minor|major"
            exit 1
          fi
          echo "v${VERSION} is unreleased"

      # Replaces `version-sync.py --release-changelog`, which used to rename
      # [Unreleased] to the version this job had just invented. The section is now
      # written by hand in the commit that bumps; this checks it was not forgotten.
      - name: Gate — CHANGELOG has a section for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            echo "::error::Write it in the commit that bumps the version."
            exit 1
          fi
          echo "CHANGELOG section for ${VERSION} present"

      - name: Gate — version agrees across ALL registered locations
        run: python3 scripts/version-sync.py --check

      - name: Gate — version consistency (marketplace.json vs plugin.json)
        run: bash scripts/check-version-consistency.sh

      - name: Gate — no personal identifiers in shipped or published files
        run: bash scripts/check-no-private-refs.sh

      - name: Gate — deterministic test suite
        run: python -m pytest tests/ -q

      - name: Gate — strict TypeScript on hooks
        run: npm run typecheck

      - name: Gate — aw CLI tests
        run: npm run test:cli

      - name: Gate — strict TypeScript on the aw CLI
        run: npm run typecheck:cli

      - name: Tag the released commit
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
