name: Guide preview (GitHub Pages)

# Publishes the bundled user guide (src/guide/index.html, the page /academic-writer:intro
# opens offline) as a web preview. One source: the same file ships in the plugin and here,
# so the preview can never drift from the guide. Needs Settings > Pages > Source:
# "GitHub Actions" (one-time).

on:
  push:
    branches: [main]
    paths:
      - 'src/guide/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload guide
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/guide

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
