name: Product site (GitHub Pages)

# Publishes the product site (site/) as the project's one GitHub Pages site, with the bundled
# offline guide (src/guide/index.html, the page /academic-writer:intro opens) copied to /guide/.
# The guide is copied, never forked, so the online and offline guides cannot drift.
# Needs Settings > Pages > Source: "GitHub Actions" (one-time).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/guide/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site/guide
          cp -R site/. _site/
          cp -R src/guide/. _site/guide/
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
