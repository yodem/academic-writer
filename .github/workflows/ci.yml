name: CI

# Runs every quality GATE that release.yml also runs, and nothing else: no bump, no
# tag, no commit, no publish. This is the gate for every push to main and every PR —
# release.yml (workflow_dispatch-only, see that file's header) no longer runs on
# push, so this file is now the ONLY thing blocking a broken change from landing on
# main.
#
# Deliberately checks the tree AS PUSHED, not a freshly-bumped one: release.yml's
# gates run after its own "bump + rebuild" step, so a couple of them (built-manifest,
# version consistency) implicitly re-validate release.yml's own rebuild. Here there is
# no bump or rebuild, so those same gates instead validate that what's actually
# committed (built plugin.json, built dist/index.js, the version registry) is correct
# right now — which is the right thing to check on every push/PR.
#
# Keep each gate step's `run:` command textually identical to release.yml's — that's
# what stops the two files from drifting apart in what they check. The ONE step
# that's factored differently is the pytest gate: release.yml pip-installs and runs
# pytest as one shell block, this file splits the pip install into its own setup
# step (grouped with the other installs below) and keeps `python -m pytest tests/ -q`
# as its own gate step — same command, different grouping, so it's still clear which
# line is the actual gate.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # release.yml's typecheck gate runs AFTER its own "npm run build" step, which
      # (via build-plugins.sh's hooks phase) installs src/hooks/node_modules as a
      # side effect. There is no build step here, so that install is done explicitly
      # instead — the gate step itself (`npm run typecheck`) stays identical either way.
      - name: Install hooks dependencies (for the typecheck gate)
        run: cd src/hooks && npm ci

      # The `aw` command-line tool (src/cli) has its own node_modules. The CLI test
      # gate, the CLI typecheck gate and the pytest gate (tests/_awbuild.py bundles
      # src/cli into a temporary `aw`, and the end-to-end tests run it) all need it,
      # and none of them runs a build first. Install it BEFORE the pytest gate.
      - name: Install CLI dependencies (for the pytest, test:cli and typecheck:cli gates)
        run: cd src/cli && npm ci

      # `src/hooks/dist/` is gitignored, so the compiled hook bundle does not
      # exist in the tree as pushed. tests/test_gate_enforce_hook.py drives the
      # COMPILED bundle through run-hook.mjs — exactly what Claude Code loads —
      # so without this the pytest gate fails on CI while passing on any machine
      # that had run a build (measured 2026-09-04: 14 failures, TST-09). The test
      # also builds on demand as a fallback; this step makes it deterministic and
      # keeps the build cost out of the gate's own timing.
      - name: Build hooks (for the pytest gate — dist/ is gitignored)
        run: npm run build:hooks

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Gate — version agrees across ALL registered locations
        run: python3 scripts/version-sync.py --check

      - name: Gate — version consistency (marketplace.json vs plugin.json)
        run: bash scripts/check-version-consistency.sh

      - name: Gate — no personal identifiers in shipped or published files
        run: bash scripts/check-no-private-refs.sh

      - name: Gate — brand file, generated tokens and About data are current
        run: |
          python3 scripts/check-brand.py --surface all
          python3 scripts/gen-brand-tokens.py --check
          python3 scripts/gen-about.py --check

      - name: Gate — deterministic test suite
        run: python -m pytest tests/ -q

      - name: Gate — strict TypeScript on hooks
        run: npm run typecheck

      - name: Gate — aw CLI tests
        run: npm run test:cli

      - name: Gate — strict TypeScript on the aw CLI
        run: npm run typecheck:cli

  # The scripts run on Python 3.9 for researchers on older Macs: the courses scripts, the home folder
  # and migration, the activity reader and the setup checks must not use newer syntax or stdlib.
  py39:
    # ubuntu-latest became 26.04 (2026-10-19), which no longer offers Python 3.9 in setup-python
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Gate — Python 3.9 suite (courses, home, activity reader, setup checks)
        run: python -m pytest -q tests/courses tests/test_home.py tests/test_home_migrate.py tests/test_activity_reader.py tests/test_setup_checks.py

  # Dashboard end to end, Chromium and Firefox, against the fixture servers in tests/e2e/dashboard.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Gate — dashboard end-to-end suite
        run: npm run test:e2e
