name: CI

# Runs every quality GATE that release.yml also runs, and nothing else: no bump, no
# tag, no commit, no publish. This is the gate for every push to main and every PR —
# release.yml (workflow_dispatch-only, see that file's header) no longer runs on
# push, so this file is now the ONLY thing blocking a broken change from landing on
# main.
#
# Deliberately checks the tree AS PUSHED, not a freshly-bumped one: release.yml's
# gates run after its own "bump + rebuild" step, so a couple of them (built-manifest,
# version consistency) implicitly re-validate release.yml's own rebuild. Here there is
# no bump or rebuild, so those same gates instead validate that what's actually
# committed (built plugin.json, built dist/index.js, the version registry) is correct
# right now — which is the right thing to check on every push/PR.
#
# Keep each gate step's `run:` command textually identical to release.yml's — that's
# what stops the two files from drifting apart in what they check. The ONE step
# that's factored differently is the pytest gate: release.yml pip-installs and runs
# pytest as one shell block, this file splits the pip install into its own setup
# step (grouped with the other installs below) and keeps `python -m pytest tests/ -q`
# as its own gate step — same command, different grouping, so it's still clear which
# line is the actual gate.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One entry point: lint, types, tests and build all live in scripts/verify.sh (phase 1 of the repo factory).
  gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify
        run: bash scripts/verify.sh

  # A new push or edit voids the maintainer's exemption label; it must be re-applied after the latest push.
  # Runs no PR code and checks nothing out.
  test-integrity-label:
    name: test-integrity-label
    if: github.event_name == 'pull_request' && contains(fromJSON('["synchronize","reopened","edited"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: remove tests-removed label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/tests-removed" || echo "label not present (ok)"

  # Lists the runners' own tests (pytest, node:test, Playwright --list) on the base and on the PR and fails when a
  # base test is missing or newly skipped. The base's copy of scripts/ judges the PR (BOOTSTRAP: the PR's copy only
  # while the base has none). Listing needs dependencies, so both trees get theirs installed first.
  test-integrity:
    name: test-integrity
    needs: test-integrity-label
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: fail closed if the label reset did not succeed
        env:
          LABEL_JOB_RESULT: ${{ needs.test-integrity-label.result }}
        run: |
          if [ "$LABEL_JOB_RESULT" = "failure" ] || [ "$LABEL_JOB_RESULT" = "cancelled" ]; then
            echo "test-integrity: label reset job failed; refusing to judge with a possibly stale label" >&2
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: check out the base into its own folder
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "origin/$BASE_REF"
      - name: install dependencies in both trees
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # One Python env for both trees: the head's requirements, then the base's (same file unless the PR changes it).
          python -m pip install -r requirements-dev.txt
          if [ -f "$RUNNER_TEMP/base/requirements-dev.txt" ]; then python -m pip install -r "$RUNNER_TEMP/base/requirements-dev.txt"; fi
          for tree in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base"; do
            for dir in . src/cli src/hooks; do
              if [ -f "$tree/$dir/package-lock.json" ]; then (cd "$tree/$dir" && npm ci); fi
            done
          done
      - name: compare test lists (base copy of the core judges the PR)
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Distinguish "absent on base" from other git errors via ls-tree output, not by ||.
          listing="$(git ls-tree --name-only "origin/$BASE_REF" scripts/test_integrity.py)"
          if [ -z "$listing" ]; then
            echo "BOOTSTRAP: base has no scripts/test_integrity.py; using the PR copy of the core"
            TI_DIR="$GITHUB_WORKSPACE/scripts"
          else
            git cat-file -e "origin/$BASE_REF:scripts/test_integrity.py"
            mkdir -p "$RUNNER_TEMP/ti"
            git archive "origin/$BASE_REF" scripts | tar -x -C "$RUNNER_TEMP/ti"
            TI_DIR="$RUNNER_TEMP/ti/scripts"
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' > "$RUNNER_TEMP/labels.txt"
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events" > "$RUNNER_TEMP/events.json"
          python3 "$TI_DIR/test_integrity.py" run --config "$TI_DIR/test-integrity.json" \
            --base-tree "$RUNNER_TEMP/base" --head-tree "$GITHUB_WORKSPACE" --base-ref "origin/$BASE_REF" \
            --pr-body-file "$RUNNER_TEMP/pr-body.txt" --labels-file "$RUNNER_TEMP/labels.txt" \
            --label-events-file "$RUNNER_TEMP/events.json"

  # The scripts run on Python 3.9 for researchers on older Macs: the courses scripts, the home folder
  # and migration, the activity reader and the setup checks must not use newer syntax or stdlib.
  py39:
    # ubuntu-latest became 26.04 (2026-10-19), which no longer offers Python 3.9 in setup-python
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Gate — Python 3.9 suite (courses, home, activity reader, setup checks)
        run: python -m pytest -q tests/courses tests/test_home.py tests/test_home_migrate.py tests/test_activity_reader.py tests/test_setup_checks.py

  # Dashboard end to end, Chromium and Firefox, against the fixture servers in tests/e2e/dashboard.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Gate — dashboard end-to-end suite
        run: npm run test:e2e

      - name: Upload e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 3

  # A Windows newcomer's first minutes: the plugin's shell shims run under Git Bash (the shell Claude Code uses
  # on Windows when Git for Windows is installed; https://code.claude.com/docs/en/hooks). Checks the Python
  # resolver, the setup checks, and the hook guard on a machine where Node.js is not on PATH.
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate — bin/aw-python finds Python 3 (skips the Store alias)
        run: sh src/bin/aw-python --version | grep -q 'Python 3'

      - name: Gate — setup checks run and print every row
        run: |
          sh src/bin/aw-python src/scripts/setup_checks.py --data-dir "$RUNNER_TEMP/aw" --json > "$RUNNER_TEMP/checks.json"
          sh src/bin/aw-python -c "import json,sys; ids={c['id'] for c in json.load(open(sys.argv[1], encoding='utf-8'))}; need={'git','node','python','drive','notebooklm','trove','kotar','moodle','gemini-key'}; assert need <= ids, need-ids" "$RUNNER_TEMP/checks.json"

      - name: Gate — hook guard prints the Node.js line and exits 0 with node absent
        run: |
          out=$(env PATH=/usr/bin sh src/hooks/bin/guard.sh lifecycle/session-env < /dev/null 2>&1); rc=$?
          echo "$out"
          test "$rc" = 0
          printf %s "$out" | grep -q 'Academic Writer needs Node.js'
