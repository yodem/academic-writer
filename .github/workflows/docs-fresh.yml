name: docs-fresh

on:
  push:
  pull_request:

jobs:
  docs-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/docs-fresh.py .
